; 22.2ch 音声のダウンミックス設定
;
; このファイルを TVTest.exe と同じフォルダに置くと、22.2ch 音声を
; 通常の音声デバイスへ出力する際の混ぜ方を指定できます。
; ファイルが無い場合や、該当するセクションが無い場合は、TVTest に
; 組み込まれた定義が使われます。
;
; 設定画面の「音声」→「22.2chの設定...」から、ダウンミックス先の
; チャンネル数と、ここで定義したプリセットを選べます。
;
;
; 書き方
;
;   [Preset:名前]
;   出力ch = 入力ch:ゲイン, 入力ch:ゲイン, ...
;
; 「名前」が設定画面の一覧に出ます。"7.1ch" / "5.1ch" / "2ch" という
; 名前は組み込み定義と同じ名前で、ここに書くとそちらが優先されます
; (内容は完全に置き換わります。組み込み定義とは合成されません)。
;
; ゲインは 0.707107 のような線形の係数か、-3dB のようなデシベル表記で
; 指定します。省略した場合は 1.0 です。
;
; 「Gain=」の行だけは特別で、ダウンミックス後の全体にかける出力ゲイン
; (クリップを避けるためのヘッドルーム) になります。省略時は 0.9 です。
; 音量が小さく感じる場合はこの値を大きくしてください。
;
;
; 出力チャンネルに使える名前と、必要な組み合わせ
;
;   2ch   : FL, FR
;   5.1ch : FL, FR, FC, LFE, BL, BR
;   7.1ch : FL, FR, FC, LFE, BL, BR, SL, SR
;
; 過不足があるとそのプリセットは使われず、組み込み定義に戻ります。
;
;
; 入力チャンネルに使える名前 (22.2ch の 24 チャンネル)
;
;   FL   前方左          FR   前方右          FC   前方中央
;   FLC  前方左中間      FRC  前方右中間
;   BL   後方左          BR   後方右          BC   後方中央
;   SL   側方左          SR   側方右
;   LFE  低域効果1       LFE2 低域効果2
;   TFL  上層前方左      TFR  上層前方右      TFC  上層前方中央
;   TBL  上層後方左      TBR  上層後方右      TBC  上層後方中央
;   TSL  上層側方左      TSR  上層側方右      TC   天井中央
;   BFL  下層前方左      BFR  下層前方右      BFC  下層前方中央
;
;
; 以下は組み込み定義と同じ内容の例です。コメントを外して使ってください。

;[Preset:7.1ch]
;FL=FL:1.0,FLC:0.707107,TFL:0.707107,BFL:0.707107
;FR=FR:1.0,FRC:0.707107,TFR:0.707107,BFR:0.707107
;FC=FC:1.0,TFC:0.707107,TC:0.5,BFC:0.707107
;LFE=LFE:1.0,LFE2:1.0
;BL=BL:1.0,BC:0.5,TBL:0.707107,TBC:0.5
;BR=BR:1.0,BC:0.5,TBR:0.707107,TBC:0.5
;SL=SL:1.0,TSL:0.707107
;SR=SR:1.0,TSR:0.707107

;[Preset:5.1ch]
;FL=FL:1.0,FLC:0.707107,TFL:0.707107,BFL:0.707107
;FR=FR:1.0,FRC:0.707107,TFR:0.707107,BFR:0.707107
;FC=FC:1.0,TFC:0.707107,TC:0.5,BFC:0.707107
;LFE=LFE:1.0,LFE2:1.0
;BL=BL:1.0,BC:0.5,TBL:0.707107,TBC:0.5,SL:0.707107,TSL:0.5
;BR=BR:1.0,BC:0.5,TBR:0.707107,TBC:0.5,SR:0.707107,TSR:0.5
